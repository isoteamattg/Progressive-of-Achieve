<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progressive of Road map 2026</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS สำหรับ Export Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- html2canvas สำหรับ Capture หน้าจอเป็นรูปภาพ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 0; background-color: #121212; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar Navigation */
    .sidebar { width: 220px; background-color: #1e1e1e; border-right: 1px solid #2d2d2d; display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 15px; font-weight: bold; font-size: 14px; border-bottom: 1px solid #2d2d2d; color: #fff; }
    .menu-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
    .menu-item { padding: 10px 15px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: #aaa; border-left: 3px solid transparent; transition: all 0.2s; }
    .menu-item:hover, .menu-item.active { background-color: #2a2a2a; color: #fff; border-left-color: #3b82f6; }
    
    /* Main Content */
    .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Top Navbar */
    .topbar { height: 50px; background-color: #1e1e1e; border-bottom: 1px solid #2d2d2d; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    .topbar-title { font-size: 16px; font-weight: bold; color: #fff; }
    .action-tools { display: flex; gap: 10px; }

    /* Action Buttons */
    .btn-action { border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 6px; color: white; transition: background 0.2s; }
    .btn-excel { background-color: #16a34a; }
    .btn-excel:hover { background-color: #15803d; }
    .btn-capture { background-color: #0284c7; }
    .btn-capture:hover { background-color: #0369a1; }

    /* Table Container */
    .content-body { padding: 15px; overflow: auto; flex-grow: 1; }
    .month-header-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .month-title { font-size: 16px; font-weight: bold; color: #fff; text-transform: uppercase; }
    
    .capture-area { background-color: #121212; padding: 10px; border-radius: 6px; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 1400px; }
    th, td { border-bottom: 1px solid #2d2d2d; padding: 8px 10px; text-align: center; vertical-align: middle; }
    th { background-color: #181818; color: #888; font-weight: 600; text-transform: uppercase; font-size: 11px; position: sticky; top: 0; z-index: 10; }
    tr:hover { background-color: #1a1a1a; }

    /* Inputs & Form Elements */
    input[type="text"], input[type="number"] {
      background-color: #2a2a2a; border: 1px solid #3d3d3d; color: #fff; padding: 4px 6px; border-radius: 4px; text-align: center; font-size: 12px; width: 100%;
    }
    input[type="number"]:focus, input[type="text"]:focus { outline: 1px solid #3b82f6; border-color: #3b82f6; }
    
    /* Status Badges */
    .badge { padding: 3px 8px; border-radius: 12px; font-weight: bold; font-size: 11px; display: inline-flex; align-items: center; gap: 4px; width: fit-content; margin: 0 auto; }
    .bg-complete { background-color: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .bg-delay { background-color: rgba(239, 68, 68, 0.15); color: #f87171; }
    .bg-achieve { background-color: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .bg-onprocess { background-color: rgba(249, 115, 22, 0.15); color: #fb923c; }
    .bg-notachieve { background-color: rgba(239, 68, 68, 0.15); color: #f87171; }

    /* File Attachment Cell */
    .file-btn { color: #888; cursor: pointer; font-size: 14px; transition: color 0.2s; }
    .file-btn:hover { color: #3b82f6; }
    .file-btn.has-file { color: #4ade80; }
    input[type="file"] { display: none; }

    .btn-add-row { background-color: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-top: 15px; font-size: 12px; }
    .btn-add-row:hover { background-color: #1d4ed8; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header"><i class="fa-solid fa-chart-line"></i> Progressive Road Map</div>
    <ul class="menu-list" id="monthMenu">
      <!-- Generated by JS -->
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Top Bar -->
    <div class="topbar">
      <div class="topbar-title">Progressive of Road map 2026</div>
      <div class="action-tools">
        <button class="btn-action btn-excel" onclick="exportToExcel()"><i class="fa-regular fa-file-excel"></i> Export Excel</button>
        <button class="btn-action btn-capture" onclick="captureScreen()"><i class="fa-solid fa-camera"></i> แคปหน้าจอ (Image)</button>
      </div>
    </div>

    <!-- Content Body -->
    <div class="content-body">
      <div class="month-header-wrapper">
        <div class="month-title" id="currentMonthTitle">JAN</div>
      </div>

      <div class="capture-area" id="captureArea">
        <table id="roadmapTable">
          <thead>
            <tr>
              <th style="text-align: left;">BU</th>
              <th>Total Task</th>
              <th>Task on plan-Complete</th>
              <th>Task Delay</th>
              <th>%</th>
              <th>Status of Action plan</th>
              <th>Total KRs</th>
              <th>On process</th>
              <th>Achieve</th>
              <th>Not Achieve</th>
              <th>On Process %</th>
              <th>Achieve %</th>
              <th>Not Achieve %</th>
              <th>Status KRs</th>
              <th>File Action Plan</th>
              <th>File Road Map</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Dynamic Rows -->
          </tbody>
        </table>
      </div>

      <button class="btn-add-row" onclick="addRow()"><i class="fa-solid fa-plus"></i> เพิ่มหน่วยงาน (BU)</button>
    </div>
  </div>

  <script>
    const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    let currentMonth = "JAN";

    // ตัวจัดเก็บข้อมูลในความจำบราวเซอร์ (Memory Store แยกตามเดือน)
    const monthlyDataStore = {};
    months.forEach(m => {
      monthlyDataStore[m] = [
        { bu: 'ISO', totalTask: 34, taskComplete: 34, taskDelay: 0, totalKRs: 9, onProcess: 2, achieve: 5, notAchieve: 2 },
        { bu: 'CIC', totalTask: 12, taskComplete: 12, taskDelay: 0, totalKRs: 3, onProcess: 0, achieve: 3, notAchieve: 0 }
      ];
    });

    // 1. สร้าง Sidebar เมนูเดือน
    function renderSidebar() {
      const menuContainer = document.getElementById("monthMenu");
      menuContainer.innerHTML = "";
      months.forEach(month => {
        const li = document.createElement("li");
        li.className = `menu-item ${month === currentMonth ? 'active' : ''}`;
        li.innerHTML = `<i class="fa-regular fa-calendar"></i> ${month}`;
        li.onclick = () => switchMonth(month);
        menuContainer.appendChild(li);
      });
    }

    // 2. สลับเดือนเมื่อคลิก Sidebar
    function switchMonth(month) {
      saveCurrentMonthData(); // บันทึกข้อมูลของเดือนเดิมก่อนย้าย
      currentMonth = month;
      document.getElementById("currentMonthTitle").innerText = month;
      renderSidebar();
      loadMonthData(month);
    }

    // บันทึกค่าเข้า Store
    function saveCurrentMonthData() {
      const rows = document.querySelectorAll("#tableBody tr");
      const monthData = [];
      rows.forEach(row => {
        monthData.push({
          bu: row.querySelector('.bu').value,
          totalTask: row.querySelector('.total-task').value,
          taskComplete: row.querySelector('.task-complete').value,
          taskDelay: row.querySelector('.task-delay').value,
          totalKRs: row.querySelector('.total-krs').value,
          onProcess: row.querySelector('.on-process').value,
          achieve: row.querySelector('.achieve').value,
          notAchieve: row.querySelector('.not-achieve').value
        });
      });
      monthlyDataStore[currentMonth] = monthData;
    }

    // โหลดข้อมูลตามเดือนที่เลือก
    function loadMonthData(month) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";
      const dataList = monthlyDataStore[month] || [];
      if (dataList.length === 0) {
        addRow(); // ถ้าไม่มีข้อมูล ให้เพิ่มแถวเปล่าให้ 1 แถว
      } else {
        dataList.forEach(d => createRow(d));
      }
    }

    function createRow(data = {}) {
      const tbody = document.getElementById("tableBody");
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td style="text-align: left;"><input type="text" class="bu" value="${data.bu || ''}" style="text-align: left;"></td>
        <td><input type="number" class="total-task" value="${data.totalTask ?? ''}" oninput="calculate(this)"></td>
        <td><input type="number" class="task-complete" value="${data.taskComplete ?? ''}" oninput="calculate(this)"></td>
        <td><input type="number" class="task-delay" value="${data.taskDelay ?? ''}" oninput="calculate(this)"></td>
        <td class="pct-task" style="color:#aaa;">0.00%</td>
        <td class="status-action">-</td>
        <td><input type="number" class="total-krs" value="${data.totalKRs ?? ''}" oninput="calculate(this)"></td>
        <td><input type="number" class="on-process" value="${data.onProcess ?? ''}" oninput="calculate(this)"></td>
        <td><input type="number" class="achieve" value="${data.achieve ?? ''}" oninput="calculate(this)"></td>
        <td><input type="number" class="not-achieve" value="${data.notAchieve ?? ''}" oninput="calculate(this)"></td>
        <td class="pct-onprocess" style="color:#aaa;">0.00%</td>
        <td class="pct-achieve" style="color:#aaa;">0.00%</td>
        <td class="pct-notachieve" style="color:#aaa;">0.00%</td>
        <td class="status-krs">-</td>
        <td>
          <label class="file-btn" title="แนบไฟล์ Action Plan">
            <i class="fa-regular fa-file-excel"></i>
            <input type="file" onchange="handleFileUpload(this)">
          </label>
        </td>
        <td>
          <label class="file-btn" title="แนบไฟล์ Road Map Result">
            <i class="fa-regular fa-file-powerpoint"></i>
            <input type="file" onchange="handleFileUpload(this)">
          </label>
        </td>
      `;

      tbody.appendChild(tr);
      calculate(tr.querySelector('.total-task'));
    }

    function calculate(element) {
      const row = element.closest('tr');

      const totalTask = parseFloat(row.querySelector('.total-task').value) || 0;
      const taskComplete = parseFloat(row.querySelector('.task-complete').value) || 0;

      const totalKRs = parseFloat(row.querySelector('.total-krs').value) || 0;
      const onProcess = parseFloat(row.querySelector('.on-process').value) || 0;
      const achieve = parseFloat(row.querySelector('.achieve').value) || 0;
      const notAchieve = parseFloat(row.querySelector('.not-achieve').value) || 0;

      // 1. คำนวณ % Task และ Status of Action plan
      const pctTaskCell = row.querySelector('.pct-task');
      const statusActionCell = row.querySelector('.status-action');

      if (row.querySelector('.total-task').value.trim() === '') {
        pctTaskCell.innerText = '';
        statusActionCell.innerHTML = '';
      } else {
        const pctTask = totalTask > 0 ? (taskComplete / totalTask) : 0;
        pctTaskCell.innerText = (pctTask * 100).toFixed(2) + '%';

        if (pctTask === 1) {
          statusActionCell.innerHTML = '<span class="badge bg-complete"><i class="fa-regular fa-circle-check"></i> Complete</span>';
        } else {
          statusActionCell.innerHTML = '<span class="badge bg-delay"><i class="fa-regular fa-circle-xmark"></i> Delay</span>';
        }
      }

      // 2. คำนวณ % KRs
      const pctOnProcess = totalKRs > 0 ? (onProcess / totalKRs) : 0;
      const pctAchieve = totalKRs > 0 ? (achieve / totalKRs) : 0;
      const pctNotAchieve = totalKRs > 0 ? (notAchieve / totalKRs) : 0;

      row.querySelector('.pct-onprocess').innerText = (pctOnProcess * 100).toFixed(2) + '%';
      row.querySelector('.pct-achieve').innerText = (pctAchieve * 100).toFixed(2) + '%';
      row.querySelector('.pct-notachieve').innerText = (pctNotAchieve * 100).toFixed(2) + '%';

      // 3. คำนวณ Status KRs
      const statusKRsCell = row.querySelector('.status-krs');

      if (row.querySelector('.total-krs').value.trim() === '' || totalKRs === 0) {
        statusKRsCell.innerHTML = '';
      } else {
        let statusKRs = "";
        if (pctNotAchieve >= Math.max(pctOnProcess, pctAchieve)) {
          statusKRs = "Not achieve";
        } else if (pctOnProcess >= pctAchieve) {
          statusKRs = "On process";
        } else if (pctAchieve > Math.max(pctOnProcess, pctNotAchieve)) {
          statusKRs = "Achieve";
        }

        let badgeHTML = "";
        if (statusKRs === "Achieve") badgeHTML = `<span class="badge bg-achieve"><i class="fa-regular fa-face-smile"></i> Achieve</span>`;
        else if (statusKRs === "On process") badgeHTML = `<span class="badge bg-onprocess"><i class="fa-regular fa-face-meh"></i> On Process</span>`;
        else if (statusKRs === "Not achieve") badgeHTML = `<span class="badge bg-notachieve"><i class="fa-regular fa-face-frown"></i> Not Achieve</span>`;

        statusKRsCell.innerHTML = badgeHTML;
      }
    }

    function handleFileUpload(input) {
      if (input.files && input.files[0]) {
        input.parentElement.classList.add('has-file');
        input.parentElement.title = "แนบไฟล์แล้ว: " + input.files[0].name;
      }
    }

    function addRow() {
      createRow();
    }

    // 4. ฟังก์ชัน Export ข้อมูลเป็น Excel File (.xlsx)
    function exportToExcel() {
      saveCurrentMonthData();
      const exportData = [];

      // ดึงข้อมูลตารางปัจจุบัน
      const rows = document.querySelectorAll("#tableBody tr");
      rows.forEach(row => {
        exportData.push({
          "BU": row.querySelector('.bu').value,
          "Total Task": row.querySelector('.total-task').value,
          "Task on plan-Complete": row.querySelector('.task-complete').value,
          "Task Delay": row.querySelector('.task-delay').value,
          "% Task": row.querySelector('.pct-task').innerText,
          "Status of Action plan": row.querySelector('.status-action').innerText,
          "Total KRs": row.querySelector('.total-krs').value,
          "On process": row.querySelector('.on-process').value,
          "Achieve": row.querySelector('.achieve').value,
          "Not Achieve": row.querySelector('.not-achieve').value,
          "On Process %": row.querySelector('.pct-onprocess').innerText,
          "Achieve %": row.querySelector('.pct-achieve').innerText,
          "Not Achieve %": row.querySelector('.pct-notachieve').innerText,
          "Status KRs": row.querySelector('.status-krs').innerText
        });
      });

      const worksheet = XLSX.utils.json_to_sheet(exportData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, currentMonth);

      // โหลดเป็นไฟล์ Excel
      XLSX.writeFile(workbook, `Progressive_Roadmap_${currentMonth}_2026.xlsx`);
    }

    // 5. ฟังก์ชัน แคปหน้าจอเป็นรูปภาพ (.png)
    function captureScreen() {
      const captureArea = document.getElementById("captureArea");
      html2canvas(captureArea, { backgroundColor: "#121212" }).then(canvas => {
        const link = document.createElement('a');
        link.download = `Roadmap_${currentMonth}_2026.png`;
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    window.onload = () => {
      renderSidebar();
      loadMonthData(currentMonth);
    };
  </script>
</body>
</html>
